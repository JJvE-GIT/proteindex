name: Prijzen bijwerken
on:
  schedule:
    - cron: "17 7 * * *"   # dagelijks, na de update van de brondata
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build.py
      - name: Resultaat opslaan
        run: |
          git config user.name "proteindex-bot"
          git config user.email "proteindex-bot@users.noreply.github.com"
          git add docs/data.json data/historie.json
          git diff --cached --quiet || git commit -m "Prijzen $(date +%F)"
          git push
